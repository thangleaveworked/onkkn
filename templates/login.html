<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VLUTE Chat System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #202123;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background-color: #343541;
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            color: #d1d5db;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo i {
            font-size: 48px;
            color: #0da37f;
        }
        .form-control {
            background-color: #40414f;
            border: 1px solid #565869;
            color: #d1d5db;
        }
        .form-control:focus {
            background-color: #40414f;
            border-color: #0da37f;
            color: #d1d5db;
            box-shadow: 0 0 0 0.25rem rgba(13, 163, 127, 0.25);
        }
        .btn-primary {
            background-color: #0da37f;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0b8c6b;
        }
        .error-message {
            color: #ff4444;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" style="width: 60px; height: auto;">
            <h3 class="mt-3">VLUTE Chat System</h3>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="email" class="form-control" id="username" name="username" 
                       placeholder="student@st.vlute.edu.vn" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}
        </form>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</body>
</html>
